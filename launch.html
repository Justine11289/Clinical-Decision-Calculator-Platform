<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />

        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self' https://cdn.jsdelivr.net https://*.smarthealthit.org https://*.cerner.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://launcher.bdlfhir.net https://fhir.sandbox.local https://*.smarthealthit.org https://*.cerner.com; upgrade-insecure-requests;"
        />

        <title>CGMH EHRCALC - 系統啟動中</title>
        <link rel="icon" type="image/svg+xml" href="app-icon.svg" />
        <link rel="apple-touch-icon" href="app-icon.svg" />
    </head>

    <body
        style="
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f8f9fa;
        "
    >
        <div style="text-align: center">
            <div
                style="
                    border: 4px solid #f3f3f3;
                    border-top: 4px solid #3498db;
                    border-radius: 50%;
                    width: 40px;
                    height: 40px;
                    animation: spin 1s linear infinite;
                    margin: 0 auto 20px;
                "
            ></div>
            <h2 id="status">正在執行安全授權流程...</h2>
            <p id="sub-status" style="color: #666">即將導向至 FHIR 授權頁面</p>
        </div>

        <style>
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>

        <script>
            if (window.location.search.includes('launch=')) {
                sessionStorage.clear();
            }

            const urlParams = new URLSearchParams(window.location.search);

            function autoExtractClientId() {
                try {
                    const launchParam = urlParams.get('launch');
                    if (!launchParam) return '';

                    let base64Str = launchParam.split('.')[1] || launchParam;
                    base64Str = base64Str.replace(/-/g, '+').replace(/_/g, '/');

                    while (base64Str.length % 4 !== 0) {
                        base64Str += '=';
                    }

                    const decodedText = atob(base64Str);
                    const launchArray = JSON.parse(decodedText);

                    if (Array.isArray(launchArray) && launchArray[9]) {
                        console.info('[MEDCALC] 成功全自動捕捉動態 Client ID:', launchArray[9]);
                        return launchArray[9];
                    }
                } catch (e) {
                    console.error('[MEDCALC] 自動抽取 Client ID 失敗:', e);
                }
                return '';
            }

            const dynamicClientId = autoExtractClientId();
            window.MEDCALC_CONFIG = {
                fhir: {
                    clientId: dynamicClientId,
                    scope: 'launch launch/patient patient/*.read openid fhirUser online_access',
                    redirectUri: 'index.html'
                }
            };

            console.info(
                '[MEDCALC] 啟動準備就緒，本次對齊的金鑰為:',
                window.MEDCALC_CONFIG.fhir.clientId
            );
        </script>

        <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.js"></script>
        <script type="module" src="js/fhir-launch.js?v=20260406"></script>
    </body>
</html>
